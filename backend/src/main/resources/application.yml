server:
  port: 8080

spring:
  application:
    name: spacetime
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

promotion:
  share:
    # Taro H5 部署基址；生产使用 HTTPS，服务端会拼接 #/pages/promotion/invite-home。
    h5-base-url: ${PROMOTION_SHARE_H5_BASE_URL:}

sms:
  # 开发和测试默认 mock；生产 profile 覆盖为 aliyun。
  provider: ${SMS_PROVIDER:mock}
  aliyun:
    endpoint: ${SMS_ENDPOINT:dysmsapi.aliyuncs.com}
    # 用户已确认短信服务复用 OSS 所属 RAM 凭证；SMS 专用变量仍保留最高优先级。
    access-key-id: ${SMS_ACCESS_KEY_ID:${OSS_ACCESS_KEY_ID:${DEV_OSS_ACCESS_KEY_ID:}}}
    access-key-secret: ${SMS_ACCESS_KEY_SECRET:${OSS_ACCESS_KEY_SECRET:${DEV_OSS_ACCESS_KEY_SECRET:}}}
    sign-name: ${SMS_SIGN_NAME:上海兴家立业网络科技}
    template-code: ${SMS_TEMPLATE_CODE:SMS_336060313}

community:
  content-security:
    provider: ${COMMUNITY_CONTENT_SECURITY_PROVIDER:wechat}
    # 微信小程序消息接收服务器 URL：/miniapp/content-security/wechat/callback
    callback-token: ${COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN:}

message:
  tencent-im:
    enabled: ${TENCENT_IM_ENABLED:false}
    sdk-app-id: ${TENCENT_IM_SDK_APP_ID:0}
    secret-key: ${TENCENT_IM_SECRET_KEY:}
    administrator: ${TENCENT_IM_ADMINISTRATOR:administrator}
    rest-base-url: ${TENCENT_IM_REST_BASE_URL:https://console.tim.qq.com}
    callback-path-token: ${TENCENT_IM_CALLBACK_PATH_TOKEN:}
    callback-auth-token: ${TENCENT_IM_CALLBACK_AUTH_TOKEN:}
    user-sig-expire-seconds: ${TENCENT_IM_USER_SIG_EXPIRE_SECONDS:86400}
    protocol-version: ${TENCENT_IM_PROTOCOL_VERSION:1}
    connect-timeout-millis: ${TENCENT_IM_CONNECT_TIMEOUT_MILLIS:3000}
    request-timeout-millis: ${TENCENT_IM_REQUEST_TIMEOUT_MILLIS:5000}
  security:
    allowed-h5-hosts: ${MESSAGE_ALLOWED_H5_HOSTS:}
  whisper-expire:
    delay-ms: ${MESSAGE_WHISPER_EXPIRE_DELAY_MS:60000}
  im-account-sync:
    delay-ms: ${MESSAGE_IM_ACCOUNT_SYNC_DELAY_MS:60000}
  fact-reconcile:
    delay-ms: ${MESSAGE_FACT_RECONCILE_DELAY_MS:300000}
  tim-mapping-audit:
    delay-ms: ${MESSAGE_TIM_MAPPING_AUDIT_DELAY_MS:300000}
  community-outbox:
    delay-ms: ${MESSAGE_COMMUNITY_OUTBOX_DELAY_MS:5000}
