spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:1}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: false

oss:
  endpoint: ${OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET}
  bucket-name: ${OSS_BUCKET_NAME:shikongxiehou}
  cdn-domain: ${OSS_CDN_DOMAIN:}
  url-expire-seconds: ${OSS_URL_EXPIRE_SECONDS:300}

wechat-pay:
  app-id: ${WECHAT_PAY_APP_ID:wx03e8cd2d1380c465}
  mch-id: ${WECHAT_PAY_MCH_ID}
  api-v3-key: ${WECHAT_PAY_API_V3_KEY}
  cert-serial-no: ${WECHAT_PAY_CERT_SERIAL_NO}
  private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:cert/apiclient_key.pem}
  merchant-cert-path: ${WECHAT_PAY_MERCHANT_CERT_PATH:cert/apiclient_cert.pem}
  notify-url: ${WECHAT_PAY_NOTIFY_URL}
  force-test-amount: ${WECHAT_PAY_FORCE_TEST_AMOUNT:false}
  test-pay-amount: ${WECHAT_PAY_TEST_PAY_AMOUNT:0.01}
  description-prefix: ${WECHAT_PAY_DESCRIPTION_PREFIX:时空邂逅}

commercial:
  vip-expiration:
    fixed-delay-ms: ${COMMERCIAL_VIP_EXPIRATION_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${COMMERCIAL_VIP_EXPIRATION_INITIAL_DELAY_MS:10000}

wechat-miniapp:
  app-id: ${WECHAT_MINIAPP_APP_ID:${WECHAT_PAY_APP_ID:wx03e8cd2d1380c465}}
  app-secret: ${WECHAT_MINIAPP_APP_SECRET}

prd01:
  content-security:
    provider: ${PRD01_CONTENT_SECURITY_PROVIDER:wechat}

sms:
  # 生产环境禁止静默使用 mock 通道；凭证缺失时由配置校验阻止启动。
  provider: ${SMS_PROVIDER:aliyun}
