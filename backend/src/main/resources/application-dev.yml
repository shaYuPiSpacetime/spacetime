spring:
  datasource:
    url: jdbc:mysql://${DEV_DB_HOST:localhost}:${DEV_DB_PORT:3306}/${DEV_DB_NAME:shikongxiehou}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DEV_DB_USER:}
    password: ${DEV_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${DEV_REDIS_HOST:localhost}
      port: ${DEV_REDIS_PORT:6379}
      username: ${DEV_REDIS_USERNAME:}
      database: ${DEV_REDIS_DATABASE:1}
      password: ${DEV_REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

logging:
  level:
    com.spacetime: DEBUG

# 仅供本地小程序预览使用；生产 profile 不创建该固定会话。
dev-fixed-login:
  enabled: ${DEV_FIXED_LOGIN_ENABLED:true}
  token: ${DEV_FIXED_LOGIN_TOKEN:dev-fixed-token-17366629764}
  phone: ${DEV_FIXED_LOGIN_PHONE:17366629764}

oss:
  endpoint: ${DEV_OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
  access-key-id: ${DEV_OSS_ACCESS_KEY_ID:}
  access-key-secret: ${DEV_OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${DEV_OSS_BUCKET_NAME:shikongxiehou}
  cdn-domain: ${DEV_OSS_CDN_DOMAIN:}
  url-expire-seconds: 300

wechat-pay:
  app-id: ${DEV_WECHAT_PAY_APP_ID:wx03e8cd2d1380c465}
  mch-id: ${DEV_WECHAT_PAY_MCH_ID:}
  api-v3-key: ${DEV_WECHAT_PAY_API_V3_KEY:}
  cert-serial-no: ${DEV_WECHAT_PAY_CERT_SERIAL_NO:}
  private-key-path: ${DEV_WECHAT_PAY_PRIVATE_KEY_PATH:cert/apiclient_key.pem}
  merchant-cert-path: ${DEV_WECHAT_PAY_MERCHANT_CERT_PATH:cert/apiclient_cert.pem}
  notify-url: ${DEV_WECHAT_PAY_NOTIFY_URL:https://admin.shikongxiehou.com/api/miniapp/payment/wechat/notify}
  description-prefix: ${DEV_WECHAT_PAY_DESCRIPTION_PREFIX:时空邂逅}
  # 测试环境只覆盖微信网关扣款金额，套餐和订单展示仍使用数据库原价。
  test-amount: ${DEV_WECHAT_PAY_TEST_AMOUNT:0.01}

commercial:
  vip-expiration:
    fixed-delay-ms: ${COMMERCIAL_VIP_EXPIRATION_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${COMMERCIAL_VIP_EXPIRATION_INITIAL_DELAY_MS:10000}

wechat-miniapp:
  app-id: ${DEV_WECHAT_MINIAPP_APP_ID:${DEV_WECHAT_PAY_APP_ID:wx03e8cd2d1380c465}}
  app-secret: ${DEV_WECHAT_MINIAPP_APP_SECRET:}
