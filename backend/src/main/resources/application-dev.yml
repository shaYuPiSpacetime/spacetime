spring:
  datasource:
    url: jdbc:mysql://${DEV_DB_HOST:rm-bp11i1ru1405fb2iqio.mysql.rds.aliyuncs.com}:${DEV_DB_PORT:3306}/${DEV_DB_NAME:shikongxiehou}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${DEV_DB_USER:}
    password: ${DEV_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${DEV_REDIS_HOST:r-bp182i9r17g2ybq30gpd.redis.rds.aliyuncs.com}
      port: ${DEV_REDIS_PORT:6379}
      username: ${DEV_REDIS_USERNAME:}
      database: ${DEV_REDIS_DATABASE:1}
      password: ${DEV_REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

knife4j:
  enable: true

logging:
  level:
    com.spacetime: DEBUG

oss:
  endpoint: ${DEV_OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
  access-key-id: ${DEV_OSS_ACCESS_KEY_ID:}
  access-key-secret: ${DEV_OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${DEV_OSS_BUCKET_NAME:spacetime}
  cdn-domain: ${DEV_OSS_CDN_DOMAIN:}
  url-expire-seconds: 300

wechat-pay:
  app-id: ${DEV_WECHAT_PAY_APP_ID:wx03e8cd2d1380c465}
  mch-id: ${DEV_WECHAT_PAY_MCH_ID:}
  api-v3-key: ${DEV_WECHAT_PAY_API_V3_KEY:}
  cert-serial-no: ${DEV_WECHAT_PAY_CERT_SERIAL_NO:}
  private-key-path: ${DEV_WECHAT_PAY_PRIVATE_KEY_PATH:cert/apiclient_key.pem}
  merchant-cert-path: ${DEV_WECHAT_PAY_MERCHANT_CERT_PATH:cert/apiclient_cert.pem}
  notify-url: ${DEV_WECHAT_PAY_NOTIFY_URL:https://admin.shikongxiehou.com/api/miniapp/payment/wechat/notify}
  force-test-amount: ${DEV_WECHAT_PAY_FORCE_TEST_AMOUNT:true}
  test-pay-amount: ${DEV_WECHAT_PAY_TEST_PAY_AMOUNT:0.01}
  description-prefix: ${DEV_WECHAT_PAY_DESCRIPTION_PREFIX:时空邂逅}

wechat-miniapp:
  app-id: ${DEV_WECHAT_MINIAPP_APP_ID:${DEV_WECHAT_PAY_APP_ID:wx03e8cd2d1380c465}}
  app-secret: ${DEV_WECHAT_MINIAPP_APP_SECRET:}
