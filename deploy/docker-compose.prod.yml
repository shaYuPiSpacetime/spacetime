name: ${PROJECT_NAME:-spacetime-prod}

services:
  backend:
    image: ${BACKEND_IMAGE:-spacetime-backend-prod:latest}
    container_name: spacetime-backend-prod
    restart: unless-stopped
    env_file:
      - /mnt/data/spacetime-prod/secrets/prod.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health | grep -q '\"code\":200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - spacetime-prod

  admin-web:
    image: ${ADMIN_IMAGE:-spacetime-admin-prod:latest}
    container_name: spacetime-admin-prod
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - spacetime-prod

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: spacetime-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod/conf.d:/etc/nginx/conf.d:ro
      - ${ADMIN_SSL_DIR:-/mnt/data/spacetime-prod/ssl}:/etc/nginx/ssl:ro
    networks:
      - spacetime-prod

networks:
  spacetime-prod:
    name: spacetime-prod
