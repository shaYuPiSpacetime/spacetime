name: ${PROJECT_NAME:-spacetime-prod}

services:
  # 首次请使用部署脚本生成受限配置；Redis 不映射宿主端口。
  redis:
    image: ${REDIS_IMAGE:-crpi-agc08x7zneglt1wg.cn-hangzhou.personal.cr.aliyuncs.com/bobo2026/bobo2026:spacetime-redis-7.4}
    container_name: spacetime-redis-prod
    restart: unless-stopped
    mem_limit: 3g
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - /mnt/data/spacetime-prod/redis/data:/data
      - /mnt/data/spacetime-prod/secrets/redis:/usr/local/etc/redis:ro
    networks:
      - spacetime-prod

  backend:
    image: ${BACKEND_IMAGE:-crpi-agc08x7zneglt1wg.cn-hangzhou.personal.cr.aliyuncs.com/bobo2026/bobo2026:spacetime-backend-prod}
    container_name: spacetime-backend-prod
    restart: unless-stopped
    env_file:
      - /mnt/data/spacetime-prod/secrets/runtime.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
    volumes:
      - ${WECHAT_PAY_CERT_DIR:-/mnt/data/spacetime-prod/secrets/cert}:/app/cert:ro
      - /mnt/data/spacetime-prod/secrets/trust:/app/trust:ro
    depends_on:
      - redis
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health | grep -q '\"code\":200'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - spacetime-prod

  admin-web:
    image: ${ADMIN_IMAGE:-crpi-agc08x7zneglt1wg.cn-hangzhou.personal.cr.aliyuncs.com/bobo2026/bobo2026:spacetime-admin-prod}
    container_name: spacetime-admin-prod
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - spacetime-prod

  nginx:
    image: ${NGINX_IMAGE:-crpi-agc08x7zneglt1wg.cn-hangzhou.personal.cr.aliyuncs.com/bobo2026/bobo2026:spacetime-nginx-prod}
    container_name: spacetime-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod/conf.d:/etc/nginx/conf.d:ro
      - ${ADMIN_SSL_DIR:-/mnt/data/spacetime-prod/ssl}:/etc/nginx/ssl:ro
      - ${SITE_SSL_DIR:-/mnt/data/spacetime-prod/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-/mnt/data/spacetime-prod/acme}:/var/www/certbot:ro
    networks:
      - spacetime-prod

networks:
  spacetime-prod:
    name: spacetime-prod
