# 兼容迁移期间缓存旧 IP 的正式客户端，业务仍写入新生产库。
server {
    listen 80;
    server_name admin.shikongxiehou.com;
    location / { return 301 https://admin.shikongxiehou.com$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.shikongxiehou.com;
    ssl_certificate /etc/nginx/ssl/admin.shikongxiehou.com.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.shikongxiehou.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;

    location / {
        proxy_pass https://47.117.142.161;
        proxy_ssl_server_name on;
        proxy_ssl_name admin.shikongxiehou.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
        proxy_set_header Host admin.shikongxiehou.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
