<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02-关系反馈后台范围</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #243047; background: #eef2f7; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    main { width: min(720px, 100%); padding: 34px; border: 1px solid #dce3ed; border-radius: 8px; background: #fff; box-shadow: 0 18px 48px rgba(26, 47, 77, .09); }
    span { color: #2876ff; font-size: 12px; font-weight: 800; }
    h1 { margin: 6px 0 12px; color: #0c285a; font-size: 25px; }
    p { margin: 0; color: #68748a; line-height: 1.8; }
    section { margin: 24px 0; padding: 18px; border-left: 4px solid #2876ff; background: #f3f7ff; }
    section strong { display: block; margin-bottom: 8px; color: #26344d; }
    ul { margin: 0; padding-left: 20px; color: #68748a; line-height: 1.9; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 20px; border: 1px solid #2876ff; border-radius: 5px; color: #fff; background: #2876ff; font-weight: 800; text-decoration: none; }
    a.secondary { color: #2876ff; background: #fff; }
  </style>
</head>
<body>
  <main>
    <span>PRD-02 / ADMIN BOUNDARY</span>
    <h1>管理后台范围说明</h1>
    <p>PRD-02 管理后台能力合并承接在 ADM-01 App 用户管理页，不新增独立菜单或关系工作台。</p>
    <section>
      <strong>本轮交付边界</strong>
      <ul>
        <li>点击 App 用户卡片“模块补充”，在“关系反馈”Tab 查看摘要和四类明细。</li>
        <li>一期不开发隐藏访问，不展示相关入口、筛选、统计或配置。</li>
        <li>关系明细默认每页 10 条，支持 10、20、50 条切换。</li>
        <li>移动端接口本轮先不实现；移动端页面仅保留静态交互说明。</li>
      </ul>
    </section>
    <div class="actions">
      <a href="../../01-用户准入与资料认证初始化/html/admin.html#ADM-01-PAGE-app-user-management">打开合并后台 Demo</a>
      <a class="secondary" href="index.html#likes">查看移动端静态说明</a>
    </div>
  </main>
</body>
</html>
