<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>02-关系反馈后台范围</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #243047; background: #eef2f7; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    main { width: min(720px, 100%); padding: 34px; border: 1px solid #dce3ed; border-radius: 8px; background: #fff; box-shadow: 0 18px 48px rgba(26, 47, 77, .09); }
    span { color: #2876ff; font-size: 12px; font-weight: 800; }
    h1 { margin: 6px 0 12px; color: #0c285a; font-size: 25px; }
    p { margin: 0; color: #68748a; line-height: 1.8; }
    section { margin: 24px 0; padding: 18px; border-left: 4px solid #2876ff; background: #f3f7ff; }
    section strong { display: block; margin-bottom: 8px; color: #26344d; }
    ul { margin: 0; padding-left: 20px; color: #68748a; line-height: 1.9; }
    a { min-height: 44px; display: inline-flex; align-items: center; padding: 0 20px; border-radius: 5px; color: #fff; background: #2876ff; font-weight: 800; text-decoration: none; }

</head>
<body>
  <main>
    <span>PRD-02 / ADMIN BOUNDARY</span>
    <h1>管理后台范围说明</h1>
    <p>依据最新《甲方前置准备清单》和《蓝湖 UI 缺少页面清单》，管理后台业务界面本轮不纳入静态 Demo。</p>
    <section>
      <strong>后台能力 PRD 保留</strong>
      <ul>
        <li>关系反馈查询能力仍由正式 PRD 定义。</li>
        <li>现有 App 用户管理的模块补充入口负责后续承接。</li>
        <li>本页不虚构独立配置页、权限按钮或接口数据。</li>
      </ul>
    </section>
    <a href="index.html#likes">返回移动端 Demo</a>
  </main>

</html>
