<main class="adm-main"><section class="adm-page-head"><div><h1>注销申请</h1><p>后台只读查看并追加备注；状态由用户操作和系统定时任务驱动。</p></div><button class="btn" data-toast="已刷新申请">刷新</button></section><section class="adm-card cancel-flow"><strong>状态流转</strong><span>提交申请 → 已申请（瞬时）→ 后悔期内 → 用户恢复账号 / 系统到期注销</span><small>前置校验不通过仅展示阻断原因，不形成有效申请；到期复核出现新阻断时保持“后悔期内”并暂停，定时任务后续重试。后台不提供审批或手工变更状态。</small></section><section class="adm-card"><div class="adm-filter-bar"><input name="cancelKeyword" placeholder="成家号/手机号"><select><option>全部状态</option><option>已申请</option><option>后悔期内</option><option>已恢复</option><option>已注销</option></select><button class="btn primary" data-toast="已查询注销申请">查询</button></div><div class="adm-table-wrap"><table><thead><tr><th>申请编号</th><th>用户</th><th>申请原因</th><th>状态</th><th>申请时间</th><th>操作</th></tr></thead><tbody data-table="cancellations"></tbody></table></div></section></main>
<div class="admin-dialog-backdrop" id="cancellationDetailModal" aria-hidden="true"><section class="admin-dialog admin-dialog-wide" role="dialog" aria-modal="true" aria-labelledby="cancellationTitle"><button class="admin-dialog-close" data-close-dialog>×</button><h2 id="cancellationTitle">注销申请详情</h2><div class="cancel-detail" data-cancellation-detail></div><label class="cancel-remark"><span>内部备注</span><textarea name="remark" maxlength="500" placeholder="仅后台可见，追加保存"></textarea></label><div class="admin-dialog-actions"><button class="btn" data-close-dialog>关闭</button><button class="btn primary" data-save-remark>追加备注</button></div></section></div><script src="mock/demo-data.js"></script><script src="assets/demo.js"></script></body></html>
