    <rect class="card" x="0" y="0" width="320" height="150" rx="5"/>
    <rect x="10" y="10" width="300" height="44" rx="4" fill="#fff1d6"/>
    <text class="date" x="30" y="38">2026-09-14 ~ 09-27</text>
    <text class="title" x="26" y="92">上线发布</text>
    <text class="desc" x="26" y="120">回归、灰度、正式上线、线上观察</text>
