<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1180" viewBox="0 0 920 1180">
  <rect width="920" height="1180" fill="#ffffff"/>
  <style>
    .card { fill: #fff; stroke: #141414; stroke-width: 2; }
    .date { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2330; }
    .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1d2230; }
    .desc { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #343a46; }
    .line { stroke: #1b1b1b; stroke-width: 1.5; stroke-dasharray: 4 5; }
    .dot { stroke: #111; stroke-width: 2; }
  </style>

  <line class="line" x1="460" y1="70" x2="460" y2="1110"/>

  <g transform="translate(80 70)">
    <rect class="card" x="0" y="0" width="320" height="150" rx="5"/>
    <rect x="10" y="10" width="300" height="44" rx="4" fill="#e8dcff"/>
    <text class="date" x="30" y="38">2026-07-06 ~ 07-12</text>
    <text class="title" x="26" y="92">正式启动</text>
    <text class="desc" x="26" y="120">范围冻结、分工确认、接口边界确认</text>
  </g>
  <circle class="dot" cx="460" cy="145" r="13" fill="#e8dcff"/>

  <g transform="translate(520 190)">
    <rect class="card" x="0" y="0" width="320" height="150" rx="5"/>
    <rect x="10" y="10" width="300" height="44" rx="4" fill="#eef3ff"/>
    <text class="date" x="30" y="38">2026-07-13 ~ 07-19</text>
    <text class="title" x="26" y="92">技术底座</text>
    <text class="desc" x="26" y="120">表结构、权限、字典、接口骨架完成</text>
  </g>
  <circle class="dot" cx="460" cy="265" r="13" fill="#eef3ff"/>

  <g transform="translate(80 310)">
    <rect class="card" x="0" y="0" width="320" height="150" rx="5"/>
    <rect x="10" y="10" width="300" height="44" rx="4" fill="#dcf6e3"/>
    <text class="date" x="30" y="38">2026-07-20 ~ 08-02</text>
    <text class="title" x="26" y="92">核心开发</text>
    <text class="desc" x="26" y="120">准入、推荐、社区、消息、商业化开工</text>
  </g>
  <circle class="dot" cx="460" cy="385" r="13" fill="#dcf6e3"/>

  <g transform="translate(520 430)">
    <rect class="card" x="0" y="0" width="320" height="150" rx="5"/>
    <rect x="10" y="10" width="300" height="44" rx="4" fill="#fff2cc"/>
    <text class="date" x="30" y="38">2026-08-03 ~ 08-16</text>
    <text class="title" x="26" y="92">后台补齐</text>
    <text class="desc" x="26" y="120">审核、财务、推广、安全、日志页面补齐</text>
  </g>
  <circle class="dot" cx="460" cy="505" r="13" fill="#fff2cc"/>

  <g transform="translate(80 550)">
    <rect class="card" x="0" y="0" width="320" height="150" rx="5"/>
    <rect x="10" y="10" width="300" height="44" rx="4" fill="#ffe1e1"/>
    <text class="date" x="30" y="38">2026-08-17 ~ 08-30</text>
    <text class="title" x="26" y="92">全链路联调</text>
    <text class="desc" x="26" y="120">移动端接口、后台操作闭环、缺陷收敛</text>
  </g>
  <circle class="dot" cx="460" cy="625" r="13" fill="#ffe1e1"/>

