    <rect x="10" y="10" width="300" height="44" rx="4" fill="#f0e8ff"/>
    <text class="date" x="30" y="38">2026-09-07 ~ 09-13</text>
    <text class="title" x="26" y="92">UAT 验收</text>
    <text class="desc" x="26" y="120">甲方/内部验收、上线清单完善</text>
  </g>
