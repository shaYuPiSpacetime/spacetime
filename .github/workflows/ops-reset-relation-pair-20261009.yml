name: ops-reset-relation-pair-20261009

on:
  push:
    branches: [ master ]
    paths:
      - 'deploy/sql/prod/108_ops_reset_relation_pair_20261009.sql'
      - '.github/workflows/ops-reset-relation-pair-20261009.yml'

concurrency:
  group: spacetime-prod-data-ops
  cancel-in-progress: false

jobs:
  reset-pair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout operation files
        uses: actions/checkout@v4

      - name: Copy one-time SQL to production host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 112.124.59.146
          username: root
          password: ${{ secrets.ALIYUN_PASSWORD }}
          source: 'deploy/sql/prod/108_ops_reset_relation_pair_20261009.sql'
          target: '/mnt/data/spacetime-prod'

      - name: Execute guarded pair reset
        id: reset
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 112.124.59.146
          username: root
          password: ${{ secrets.ALIYUN_PASSWORD }}
          capture_stdout: true
          script: |
            set +e
            cd /mnt/data/spacetime-prod
            reset_output="$(bash deploy/scripts/migrate-prod-db.sh \
              deploy/sql/prod/108_ops_reset_relation_pair_20261009.sql 2>&1)"
            reset_status=$?
            reset_tail="$(printf '%s\n' "$reset_output" | tail -n 20 | base64 -w0)"
            printf 'OPS_RESULT|%s|%s\n' "$reset_status" "$reset_tail"
            exit 0

      - name: Publish guarded reset result
        if: always()
        env:
          RESET_OUTCOME: ${{ steps.reset.outcome }}
          RESET_STDOUT: ${{ steps.reset.outputs.stdout }}
        run: |
          result_line="$(printf '%s\n' "$RESET_STDOUT" | grep '^OPS_RESULT|' | tail -n 1)"
          reset_status="$(printf '%s' "$result_line" | cut -d'|' -f2)"
          encoded_summary="$(printf '%s' "$result_line" | cut -d'|' -f3)"
          summary="$(printf '%s' "$encoded_summary" | base64 -d 2>/dev/null | tr '\n' ' ' | cut -c1-900)"
          if [ "$RESET_OUTCOME" != 'success' ] || [ "$reset_status" != '0' ]; then
            echo "::error title=Guarded pair reset failed::${summary:-no diagnostic captured}"
            exit 1
          fi
          echo "::notice title=Guarded pair reset completed::${summary:-completed without stdout}"
