name: spacetime-backend-prod

on:
  push:
    branches: [ master ]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - 'scripts/test-prod-tencent-im-config.mjs'
      - '.github/workflows/deploy-backend-prod.yml'
  workflow_dispatch:

concurrency:
  group: spacetime-prod-deploy
  cancel-in-progress: false

env:
  ALIYUN_CR_REGISTRY: crpi-agc08x7zneglt1wg.cn-hangzhou.personal.cr.aliyuncs.com
  ALIYUN_REGISTRY_USER_NAME: '393841724@qq.com'
  DOCKER_NAMESPACE: bobo2026
  BACKEND_IMAGE_NAME: bobo2026
  BACKEND_IMAGE_TAG: spacetime-backend-prod
  NGINX_IMAGE_NAME: bobo2026
  NGINX_IMAGE_TAG: spacetime-nginx-prod
  PROD_SERVER_HOST: 112.124.59.146
  PROD_SERVER_USER: root
  PROD_DEPLOY_DIR: /mnt/data/spacetime-prod/deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate production runtime configuration
        run: |
          bash -n deploy/scripts/resolve-oss-endpoint.sh deploy/scripts/migrate-prod-db.sh deploy/scripts/deploy-prod-local.sh
          node scripts/test-prod-oss-endpoint.mjs
          node scripts/test-prod-wechat-pay-config.mjs
          node scripts/test-prod-tencent-im-config.mjs

      - name: Validate WeChat callback token
        env:
          HAS_COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN: ${{ secrets.COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN != '' }}
        run: |
          if [ "$HAS_COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN" != "true" ]; then
            echo "::error::请在 GitHub Actions Secrets 中配置 COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN"
            exit 1
          fi

      - name: Validate ACR password
        env:
          HAS_ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD != '' }}
        run: |
          if [ "$HAS_ALIYUN_REGISTRY_PASSWORD" != "true" ]; then
            echo "::error::请在 GitHub Secrets 中配置 ALIYUN_REGISTRY_PASSWORD"
            exit 1
          fi

      - name: Login to ACR
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ env.ALIYUN_CR_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USER_NAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build backend image
        run: |
          set -e
          docker build \
            -f backend/Dockerfile \
            -t "${ALIYUN_CR_REGISTRY}/${DOCKER_NAMESPACE}/${BACKEND_IMAGE_NAME}:${BACKEND_IMAGE_TAG}" \
            backend

      - name: Push nginx runtime image
        run: |
          set -e
          docker pull nginx:1.27-alpine
          docker tag nginx:1.27-alpine "${ALIYUN_CR_REGISTRY}/${DOCKER_NAMESPACE}/${NGINX_IMAGE_NAME}:${NGINX_IMAGE_TAG}"
          docker push "${ALIYUN_CR_REGISTRY}/${DOCKER_NAMESPACE}/${NGINX_IMAGE_NAME}:${NGINX_IMAGE_TAG}"

      - name: Push backend image
        run: |
          set -e
          docker push "${ALIYUN_CR_REGISTRY}/${DOCKER_NAMESPACE}/${BACKEND_IMAGE_NAME}:${BACKEND_IMAGE_TAG}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN: ${{ secrets.COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN }}
    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Sync deploy files over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.PROD_SERVER_HOST }}
          username: ${{ env.PROD_SERVER_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          source: 'deploy/scripts/*,deploy/nginx-prod/conf.d/*,deploy/sql/prod/071_prd03_message_mobile_contract.sql,deploy/sql/prod/072_prd03_admin_menu_visibility.sql,deploy/sql/prod/073_prd03_platform_message_plaintext.sql,deploy/sql/prod/074_prd03_remove_message_kms.sql,deploy/sql/prod/075_prd03_tim_message_lookup_index.sql,deploy/sql/prod/076_prd03_im_account_sdk_app_id.sql,deploy/sql/prod/077_prd01_wechat_content_security.sql'
          target: '/mnt/data/spacetime-prod'

      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN: ${{ secrets.COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN }}
        with:
          host: ${{ env.PROD_SERVER_HOST }}
          username: ${{ env.PROD_SERVER_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
          envs: ALIYUN_REGISTRY_PASSWORD,COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN
          script_stop: true
          script: |
            set -e
            [ -n "${COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN:-}" ] || { echo "微信内容安全回调 Token 未配置"; exit 1; }
            prod_env=/mnt/data/spacetime-prod/secrets/prod.env
            [ -f "$prod_env" ] || { echo "生产 prod.env 不存在"; exit 1; }
            tmp_env="$(mktemp)"
            trap 'rm -f "$tmp_env"' EXIT
            awk '
              BEGIN { updated = 0 }
              /^COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN=/ {
                print "COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN=" ENVIRON["COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN"]
                updated = 1
                next
              }
              { print }
              END {
                if (!updated) print "COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN=" ENVIRON["COMMUNITY_CONTENT_SECURITY_CALLBACK_TOKEN"]
              }
            ' "$prod_env" > "$tmp_env"
            chmod 600 "$tmp_env"
            mv "$tmp_env" "$prod_env"
            trap - EXIT
            cd "${{ env.PROD_DEPLOY_DIR }}"
            bash scripts/migrate-prod-db.sh \
              deploy/sql/prod/071_prd03_message_mobile_contract.sql \
              deploy/sql/prod/072_prd03_admin_menu_visibility.sql \
              deploy/sql/prod/073_prd03_platform_message_plaintext.sql \
              deploy/sql/prod/074_prd03_remove_message_kms.sql \
              deploy/sql/prod/075_prd03_tim_message_lookup_index.sql \
              deploy/sql/prod/076_prd03_im_account_sdk_app_id.sql \
              deploy/sql/prod/077_prd01_wechat_content_security.sql
            bash scripts/deploy-prod-local.sh backend
